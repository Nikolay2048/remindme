  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # One-time init: pulls the model on first start (uses the same ollama_data volume)
  ollama_init:
    image: ollama/ollama:latest
    container_name: ollama_init
    depends_on:
      - ollama
    entrypoint: [ "/bin/sh", "-lc" ]
    command: >
      "sleep 3 &&
       ollama pull ${LLM_MODEL:-qwen2.5:14b-instruct}"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ollama_data:/root/.ollama
    restart: "no"


  app:
    build:
      context: .
      args:
        TORCH_REQUIREMENTS: requirements.cpu.txt
    container_name: remindme_app

    depends_on:
      - db
      - ollama
    env_file: .env

    environment:
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}

      ASR_URL: ${ASR_URL:-http://asr:9000}

      # Ollama
      # OLLAMA_HOST: http://ollama:11434
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:14b-instruct}

      DEVICE: ${DEVICE:-cpu}
      COMPUTE_TYPE: ${COMPUTE_TYPE:-int8}

    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    working_dir: /app



volumes:
  postgres_data:
  whisperx-cache:
    driver: local
  ollama_data:
    driver: local
