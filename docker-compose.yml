services:
  db:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/sql/db_init.sql:/docker-entrypoint-initdb.d/init.sql

  app:
    build: .
    container_name: remindme_app
    depends_on:
      - db
      - asr
    env_file: .env
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_TABLE: ${DB_TABLE}
      ASR_URL: http://asr:8000
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    working_dir: /app

  asr:
    env_file:
      - .env
    build:
      context: .
      dockerfile: docker/asr/Dockerfile
    restart: unless-stopped

    deploy:
      resources:
        reservations:
          devices:
              - driver: nvidia
                count: all
                capabilities: [ gpu ]

    ports:
      - "9000:9000"

    environment:
      # All values loaded from .env file
      - DEVICE=${DEVICE:-cuda}
      - COMPUTE_TYPE=${COMPUTE_TYPE:-float16}
      - BATCH_SIZE=${BATCH_SIZE:-16}
      - HF_TOKEN=${HF_TOKEN}
      - CACHE_DIR=${CACHE_DIR:-/.cache}
      - HF_HOME=${CACHE_DIR:-/.cache}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-}
      - NLTK_DATA=/.cache/nltk_data
      - PRELOAD_MODEL=${PRELOAD_MODEL:-}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-1000}

    volumes:
      # Persistent cache for models (recommended)
      - whisperx-cache:/.cache

    healthcheck:
      test: [ "CMD", "python3", "-c", "import requests; requests.get('http://localhost:9000/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  whisperx-cache:
    driver: local
